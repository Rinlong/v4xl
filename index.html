<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Khí Tiết & Vận Thời</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Lora:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f4ed;
      --card-bg: #ffffff;
      --card-sub: #faf8f5;
      --border: #ede7dc;
      --border-focus: #c5b69c;
      
      --text: #2c2825;
      --text-sub: #6e675f;
      --text-muted: #9c9388;
      
      --zen-green: #2d7a4d;
      --zen-green-bg: #eaf5ee;
      --zen-green-border: #bce3cb;
      
      --zen-gold: #b47a16;
      --zen-gold-bg: #fdf6e7;
      --zen-gold-border: #f4ddaf;
      
      --zen-blue: #1d7293;
      --zen-blue-bg: #ebf5fa;
      --zen-blue-border: #c4e4f2;
      
      --zen-red: #ba384c;
      --zen-red-bg: #fcedf0;
      --zen-red-border: #f4c2cb;

      --shadow: 0 4px 18px rgba(92, 79, 63, 0.05);
      --shadow-hover: 0 8px 24px rgba(92, 79, 63, 0.09);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Quicksand', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding: 12px; font-size: 14px; line-height: 1.6; max-width: 520px; margin: 0 auto; padding-bottom: 60px; overflow-x: hidden; }

    /* Top Bar */
    .top-bar { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 14px; margin-bottom: 14px; box-shadow: var(--shadow); }
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .brand-title { font-family: 'Lora', serif; font-size: 1.15rem; font-weight: 600; color: #3f362e; display: flex; align-items: center; gap: 8px; }
    .brand-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--zen-green); box-shadow: 0 0 10px rgba(45, 122, 77, 0.4); }
    .btn-cfg { background: var(--card-sub); border: 1px solid var(--border); color: var(--text-sub); font-size: 0.78rem; padding: 6px 12px; border-radius: 12px; font-weight: 600; cursor: pointer; }

    .cfg-panel { display: none; grid-template-columns: 1fr 1fr; gap: 10px; padding-top: 12px; margin-top: 12px; border-top: 1px dashed var(--border); }
    .cfg-panel.open { display: grid; }
    .field-wrap label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; }
    .field-wrap input, .field-wrap select { width: 100%; background: var(--card-sub); border: 1px solid var(--border); color: var(--text); padding: 9px 11px; border-radius: 12px; font-size: 0.88rem; font-weight: 600; }

    .date-nav-row { display: flex; gap: 6px; align-items: center; }
    .date-nav-row input { flex: 1; min-width: 0; background: var(--card-sub); border: 1px solid var(--border); color: var(--text); padding: 9px 8px; border-radius: 12px; font-size: 0.92rem; font-weight: 700; text-align: center; }
    .nav-btn { background: var(--card-sub); border: 1px solid var(--border); color: var(--text); padding: 9px 12px; border-radius: 12px; font-weight: 700; cursor: pointer; flex-shrink: 0; }
    .nav-btn-today { background: #3f362e; color: #fff; border: none; padding: 9px 14px; border-radius: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0; }

    /* Day Overview Card */
    .day-banner { background: #ffffff; border: 1px solid var(--border); border-radius: 20px; padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
    .day-banner::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #c7a76c, #89a387, #85b0bf); }
    
    .badge-capsules { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .zen-pill { background: var(--card-sub); color: var(--text-sub); border: 1px solid var(--border); font-size: 0.73rem; font-weight: 600; padding: 4px 10px; border-radius: 20px; }
    .zen-pill-hl { background: var(--zen-gold-bg); color: var(--zen-gold); border-color: var(--zen-gold-border); }

    .day-maintitle { font-family: 'Lora', serif; font-size: 1.1rem; font-weight: 600; color: #2c2520; margin-bottom: 6px; }
    .day-maindesc { font-size: 0.86rem; color: var(--text-sub); line-height: 1.55; margin-bottom: 14px; }

    /* Thanh cuộn vuốt ngang các thẻ tiêu điểm (Không bao giờ bị tràn hay đơ) */
    .summary-tiles-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; margin: 0 -4px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .summary-tiles-scroll::-webkit-scrollbar { display: none; }
    
    .zen-tile { flex: 0 0 78%; max-width: 250px; scroll-snap-align: start; background: var(--card-sub); border: 1px solid var(--border); border-radius: 16px; padding: 12px 14px; cursor: pointer; transition: all 0.2s; }
    .zen-tile:active { transform: scale(0.98); }
    .zen-tile.t-green { border-left: 4px solid var(--zen-green); }
    .zen-tile.t-red { border-left: 4px solid var(--zen-red); }
    .zen-tile.t-blue { border-left: 4px solid var(--zen-blue); }
    .zen-tile.t-gold { border-left: 4px solid var(--zen-gold); }
    
    .tile-tag { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }
    .tile-time { font-size: 0.98rem; font-weight: 700; color: var(--text); }
    .tile-sub { font-size: 0.75rem; color: var(--text-muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Wave Energy Bars */
    .bars-container { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 14px; margin-bottom: 16px; box-shadow: var(--shadow); }
    .bars-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 0.78rem; font-weight: 700; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.4px; }
    .bars-legend { display: flex; gap: 8px; font-size: 0.7rem; text-transform: none; font-weight: 600; }
    .b-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 3px; }

    .bars-grid-wrap { overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .bars-grid-wrap::-webkit-scrollbar { display: none; }
    .bars-grid { display: grid; grid-template-columns: repeat(12, minmax(28px, 1fr)); gap: 3px; height: 130px; align-items: end; border-bottom: 1px solid var(--border); padding-bottom: 6px; padding-top: 20px; min-width: 360px; }
    .b-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; cursor: pointer; position: relative; border-radius: 6px; padding: 2px 0; }
    .b-col.active { background: #f0ebe1; }
    .b-score { font-size: 0.65rem; font-weight: 700; margin-bottom: 3px; color: var(--text-muted); }
    .b-col.active .b-score { color: var(--text); font-weight: 800; }
    .b-stem { width: 68%; border-radius: 5px 5px 2px 2px; transition: height 0.3s ease; min-height: 12px; }
    .b-label { font-size: 0.65rem; color: var(--text-sub); margin-top: 5px; font-weight: 600; text-align: center; line-height: 1.15; }
    .b-col.active .b-label { color: #3f362e; font-weight: 800; }
    .now-indicator { position: absolute; top: 2px; width: 5px; height: 5px; border-radius: 50%; background: var(--zen-green); }

    /* Filter Pills */
    .filter-track { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; scrollbar-width: none; }
    .filter-track::-webkit-scrollbar { display: none; }
    .zen-f-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-sub); padding: 6px 12px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; white-space: nowrap; cursor: pointer; }
    .zen-f-btn.active { background: #3f362e; color: #fff; border-color: #3f362e; }

    /* Timeline Hour Cards */
    .timeline-stack { display: flex; flex-direction: column; gap: 12px; }
    .zen-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 16px; box-shadow: var(--shadow); transition: all 0.2s ease; scroll-margin-top: 16px; }
    .zen-card.focused { border-color: var(--border-focus); box-shadow: var(--shadow-hover); background: #ffffff; }

    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 6px; }
    .card-time { font-family: 'Lora', serif; font-size: 1.05rem; font-weight: 600; color: #2c2520; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .badge-live-now { background: var(--zen-green-bg); color: var(--zen-green); border: 1px solid var(--zen-green-border); font-size: 0.65rem; font-weight: 700; padding: 1px 6px; border-radius: 6px; font-family: 'Quicksand', sans-serif; }
    .card-target { font-size: 0.78rem; color: var(--text-sub); margin-top: 2px; font-weight: 600; }

    .card-verdict-pill { padding: 4px 10px; border-radius: 16px; font-size: 0.75rem; font-weight: 700; text-align: right; white-space: nowrap; flex-shrink: 0; }
    .pill-green { background: var(--zen-green-bg); color: var(--zen-green); border: 1px solid var(--zen-green-border); }
    .pill-blue { background: var(--zen-blue-bg); color: var(--zen-blue); border: 1px solid var(--zen-blue-border); }
    .pill-gold { background: var(--zen-gold-bg); color: var(--zen-gold); border: 1px solid var(--zen-gold-border); }
    .pill-red { background: var(--zen-red-bg); color: var(--zen-red); border: 1px solid var(--zen-red-border); }

    /* Thiết kế lại hộp Túi tiền: Tầng trên Tiêu đề & Tag, Tầng dưới Nội dung đầy đủ */
    .wallet-box { border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
    .w-green { background: var(--zen-green-bg); border: 1px solid var(--zen-green-border); }
    .w-blue { background: var(--zen-blue-bg); border: 1px solid var(--zen-blue-border); }
    .w-gold { background: var(--zen-gold-bg); border: 1px solid var(--zen-gold-border); }
    .w-red { background: var(--zen-red-bg); border: 1px solid var(--zen-red-border); }

    .wallet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; gap: 8px; }
    .wallet-title { font-weight: 700; font-size: 0.88rem; color: #2c2520; display: flex; align-items: center; gap: 4px; }
    .w-tag { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; padding: 3px 9px; border-radius: 8px; white-space: nowrap; flex-shrink: 0; }
    .w-tag-green { background: var(--zen-green); color: #fff; }
    .w-tag-blue { background: var(--zen-blue); color: #fff; }
    .w-tag-gold { background: var(--zen-gold); color: #fff; }
    .w-tag-red { background: var(--zen-red); color: #fff; }
    .wallet-body { font-size: 0.85rem; color: #423b34; line-height: 1.5; width: 100%; }

    .card-vibe { font-style: italic; color: #524a42; font-family: 'Lora', serif; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #f0eae1; font-size: 0.88rem; line-height: 1.5; }

    .lines-list { display: flex; flex-direction: column; gap: 8px; }
    .line-row { display: flex; gap: 8px; align-items: flex-start; font-size: 0.84rem; line-height: 1.5; }
    .line-icon { font-size: 0.92rem; line-height: 1.35; flex-shrink: 0; }
    .line-title { font-weight: 700; margin-right: 4px; }
    .t-gr { color: var(--zen-green); }
    .t-go { color: var(--zen-gold); }
    .t-bl { color: var(--zen-blue); }

    .card-foot { margin-top: 12px; padding-top: 8px; border-top: 1px dashed var(--border); font-size: 0.72rem; color: var(--text-muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px; }
  </style>
</head>
<body>

  <!-- Thanh điều khiển trên cùng -->
  <div class="top-bar">
    <div class="header-row">
      <div class="brand-title">
        <span class="brand-dot"></span>
        <span>Khí Tiết & Vận Thời</span>
      </div>
      <button class="btn-cfg" onclick="toggleConfig()">⚙ Bản mệnh</button>
    </div>

    <div class="date-nav-row">
      <button class="nav-btn" onclick="adjustDay(-1)">◀</button>
      <input type="date" id="targetDate" onchange="bootApp()">
      <button class="nav-btn" onclick="adjustDay(1)">▶</button>
      <button class="nav-btn-today" onclick="goToday()">Hôm nay</button>
    </div>

    <div class="cfg-panel" id="cfgPanel">
      <div class="field-wrap">
        <label>Ngày sinh Dương lịch</label>
        <input type="date" id="birthDate" value="2002-07-10" onchange="bootApp()">
      </div>
      <div class="field-wrap">
        <label>Giờ sinh</label>
        <select id="birthHour" onchange="bootApp()">
          <option value="0">Tý (23h - 01h)</option>
          <option value="1">Sửu (01h - 03h)</option>
          <option value="2">Dần (03h - 05h)</option>
          <option value="3">Mão (05h - 07h)</option>
          <option value="4">Thìn (07h - 09h)</option>
          <option value="5" selected>Tị (09h - 11h)</option>
          <option value="6">Ngọ (11h - 13h)</option>
          <option value="7">Mùi (13h - 15h)</option>
          <option value="8">Thân (15h - 17h)</option>
          <option value="9">Dậu (17h - 19h)</option>
          <option value="10">Tuất (19h - 21h)</option>
          <option value="11">Hợi (21h - 23h)</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Tổng quan ngày & 4 tiêu điểm cuộn ngang mượt mà -->
  <div class="day-banner" id="dayBanner"></div>

  <!-- Biểu đồ sóng 12 khung giờ -->
  <div class="bars-container">
    <div class="bars-head">
      <span>Dòng Khí 12 Khung Giờ</span>
      <div class="bars-legend">
        <span><i class="b-dot" style="background:var(--zen-green)"></i>Thuận</span>
        <span><i class="b-dot" style="background:var(--zen-blue)"></i>Bình</span>
        <span><i class="b-dot" style="background:var(--zen-gold)"></i>Biến động</span>
        <span><i class="b-dot" style="background:var(--zen-red)"></i>Chậm</span>
      </div>
    </div>
    <div class="bars-grid-wrap">
      <div class="bars-grid" id="barsGrid"></div>
    </div>
  </div>

  <!-- Bộ lọc nhanh -->
  <div class="filter-track">
    <button class="zen-f-btn active" onclick="applyFilter('all', this)">Tất cả 12 giờ</button>
    <button class="zen-f-btn" onclick="applyFilter('spend', this)">💸 Giờ Nên Chi Tiền</button>
    <button class="zen-f-btn" onclick="applyFilter('lock', this)">🔒 Giờ Nên Giữ Ví</button>
    <button class="zen-f-btn" onclick="applyFilter('good', this)">✨ Giờ Thuận Lợi</button>
  </div>

  <!-- Danh sách từng canh giờ -->
  <div class="timeline-stack" id="timelineStack"></div>

<script>
/* ==========================================================
   THIÊN VĂN & ÂM DƯƠNG (HỒ NGỌC ĐỨC)
   ========================================================== */
const PI = Math.PI;
function INT(d) { return Math.floor(d); }
function jdFromDate(dd, mm, yy) {
  let a = INT((14 - mm) / 12), y = yy + 4800 - a, m = mm + 12 * a - 3;
  let jd = dd + INT((153 * m + 2) / 5) + 365 * y + INT(y / 4) - INT(y / 100) + INT(y / 400) - 32045;
  return jd < 2299161 ? dd + INT((153 * m + 2) / 5) + 365 * y + INT(y / 4) - 32083 : jd;
}
function getNewMoonDay(k, tz) {
  let T = k / 1236.85, T2 = T * T, T3 = T2 * T, dr = PI / 180;
  let Jd1 = 2415020.75933 + 29.53058868 * k + 0.0001178 * T2 - 0.000000155 * T3 + 0.00033 * Math.sin((166.56 + 132.87 * T - 0.009173 * T2) * dr);
  let M = 359.2242 + 29.10535608 * k - 0.0000333 * T2 - 0.00000347 * T3;
  let Mpr = 306.0253 + 385.81691806 * k + 0.0107306 * T2 + 0.00001236 * T3;
  let F = 21.2964 + 390.67050646 * k - 0.0016528 * T2 - 0.00000239 * T3;
  let C1 = (0.1734 - 0.000393 * T) * Math.sin(M * dr) + 0.0021 * Math.sin(2 * dr * M) - 0.4068 * Math.sin(Mpr * dr) + 0.0161 * Math.sin(dr * 2 * Mpr) - 0.0004 * Math.sin(dr * 3 * Mpr) + 0.0104 * Math.sin(dr * 2 * F) - 0.0051 * Math.sin(dr * (M + Mpr)) - 0.0074 * Math.sin(dr * (M - Mpr)) + 0.0004 * Math.sin(dr * (2 * F + M)) - 0.0004 * Math.sin(dr * (2 * F - M)) - 0.0006 * Math.sin(dr * (2 * F + Mpr)) + 0.0010 * Math.sin(dr * (2 * F - Mpr)) + 0.0005 * Math.sin(dr * (2 * Mpr + M));
  let deltat = (T < -11) ? (0.001 + 0.000839 * T + 0.0002261 * T2 - 0.00000845 * T3 - 0.000000081 * T * T3) : (-0.000278 + 0.000265 * T + 0.000262 * T2);
  return INT(Jd1 + C1 - deltat + 0.5 + tz / 24.0);
}
function getSunLongitude(jdn, tz) {
  let T = (jdn - 2451545.5 - tz / 24) / 36525, T2 = T * T, dr = PI / 180;
  let M = 357.52910 + 35999.05030 * T - 0.0001559 * T2 - 0.00000048 * T * T2;
  let L0 = 280.46645 + 36000.76983 * T + 0.0003032 * T2;
  let DL = (1.914600 - 0.004817 * T - 0.000014 * T2) * Math.sin(dr * M) + (0.019993 - 0.000101 * T) * Math.sin(dr * 2 * M) + 0.000290 * Math.sin(dr * 3 * M);
  let L = (L0 + DL) * dr;
  L = L - PI * 2 * INT(L / (PI * 2));
  return INT(L / PI * 6);
}
function getLunarMonth11(yy, tz) {
  let off = jdFromDate(31, 12, yy) - 2415021, k = INT(off / 29.530588853), nm = getNewMoonDay(k, tz);
  return getSunLongitude(nm, tz) >= 9 ? getNewMoonDay(k - 1, tz) : nm;
}
function getLeapMonthOffset(a11, tz) {
  let k = INT((a11 - 2415021.076998695) / 29.530588853 + 0.5), last = 0, i = 1, arc = getSunLongitude(getNewMoonDay(k + i, tz), tz);
  do { last = arc; i++; arc = getSunLongitude(getNewMoonDay(k + i, tz), tz); } while (arc !== last && i < 14);
  return i - 1;
}
function convertSolar2Lunar(dd, mm, yy, tz = 7) {
  let dayNumber = jdFromDate(dd, mm, yy), k = INT((dayNumber - 2415021.076998695) / 29.530588853);
  let monthStart = getNewMoonDay(k + 1, tz);
  if (monthStart > dayNumber) monthStart = getNewMoonDay(k, tz);
  let a11 = getLunarMonth11(yy, tz), b11 = a11, lunarYear;
  if (a11 >= monthStart) { lunarYear = yy; a11 = getLunarMonth11(yy - 1, tz); }
  else { lunarYear = yy + 1; b11 = getLunarMonth11(yy + 1, tz); }
  let lunarDay = dayNumber - monthStart + 1, diff = INT((monthStart - a11) / 29), lunarMonth = diff + 11;
  if (b11 - a11 > 365) {
    let leapMonthDiff = getLeapMonthOffset(a11, tz);
    if (diff >= leapMonthDiff) lunarMonth = diff + 10;
  }
  if (lunarMonth > 12) lunarMonth -= 12;
  if (lunarMonth >= 11 && diff < 4) lunarYear -= 1;
  return { d: lunarDay, m: lunarMonth, y: lunarYear, jd: dayNumber };
}

/* ==========================================================
   HỆ THỐNG TRI THỨC PHONG THỦY & TỬ VI
   ========================================================== */
const CAN = ["Giáp", "Ất", "Bính", "Đinh", "Mậu", "Kỷ", "Canh", "Tân", "Nhâm", "Quý"];
const CHI = ["Tý", "Sửu", "Dần", "Mão", "Thìn", "Tị", "Ngọ", "Mùi", "Thân", "Dậu", "Tuất", "Hợi"];
const CUNG_NAMES = ["Mệnh", "Phụ Mẫu", "Phúc Đức", "Điền Trạch", "Quan Lộc", "Nô Bộc", "Thiên Di", "Tật Ách", "Tài Bạch", "Tử Tức", "Phu Thê", "Huynh Đệ"];

const TU_HOA_TABLE = [
  ["Liêm Trinh", "Phá Quân", "Vũ Khúc", "Thái Dương"],
  ["Thiên Cơ", "Thiên Lương", "Tử Vi", "Thái Âm"],
  ["Thiên Đồng", "Thiên Cơ", "Văn Xương", "Liêm Trinh"],
  ["Thái Âm", "Thiên Đồng", "Thiên Cơ", "Cự Môn"],
  ["Tham Lang", "Thái Âm", "Hữu Bật", "Thiên Cơ"],
  ["Vũ Khúc", "Tham Lang", "Thiên Lương", "Văn Khúc"],
  ["Thái Dương", "Vũ Khúc", "Thái Âm", "Thiên Đồng"],
  ["Cự Môn", "Thái Dương", "Văn Khúc", "Văn Xương"],
  ["Thiên Lương", "Tử Vi", "Tả Phù", "Vũ Khúc"],
  ["Phá Quân", "Cự Môn", "Thái Âm", "Tham Lang"]

const LOC_TON_POS = [2, 3, 5, 6, 5, 6, 8, 9, 11, 0];
const KHOI_VIET_POS = [[1, 7], [0, 8], [11, 9], [11, 9], [1, 7], [0, 8], [6, 2], [6, 2], [3, 5], [3, 5]];

function buildBaseChart(lunarBirth, birthHour) {
  let yCan = (lunarBirth.y + 6) % 10;
  let posMonth = (2 + lunarBirth.m - 1) % 12;
  let cungMenh = (posMonth - birthHour + 12) % 12;

  let startCanDan = ((yCan % 5) * 2 + 2) % 10;
  let menhCan = (startCanDan + (cungMenh - 2 + 12) % 12) % 10;
  let napAmIdx = Math.floor(menhCan / 2) + 1 + [0, 0, 1, 1, 2, 2, 0, 0, 1, 1, 2, 2][cungMenh];
  if (napAmIdx > 5) napAmIdx -= 5;
  let cuc = { 1: 4, 2: 2, 3: 6, 4: 5, 5: 3 }[napAmIdx];

  let palaces = Array.from({ length: 12 }, (_, i) => ({
    chiIdx: i, chiName: CHI[i], cungName: "", chinhTinh: [], catTinh: [], hungTinh: [], haoTinh: []
  }));
  for (let i = 0; i < 12; i++) palaces[(cungMenh + i) % 12].cungName = CUNG_NAMES[i];

  let d = lunarBirth.d, posTuVi;
  if (d % cuc === 0) posTuVi = (2 + (d / cuc) - 1) % 12;
  else {
    let rem = cuc - (d % cuc), basePos = (2 + ((d + rem) / cuc) - 1) % 12;
    posTuVi = (rem % 2 === 1) ? (basePos - rem + 12) % 12 : (basePos + rem) % 12;
  }
  let posThienPhu = (4 - posTuVi + 12) % 12;

  [[0, "Tử Vi"], [-1, "Thiên Cơ"], [-3, "Thái Dương"], [-4, "Vũ Khúc"], [-5, "Thiên Đồng"], [-8, "Liêm Trinh"]]
    .forEach(([off, name]) => palaces[(posTuVi + off + 12) % 12].chinhTinh.push(name));
  [[0, "Thiên Phủ"], [1, "Thái Âm"], [2, "Tham Lang"], [3, "Cự Môn"], [4, "Thiên Tướng"], [5, "Thiên Lương"], [6, "Thất Sát"], [10, "Phá Quân"]]
    .forEach(([off, name]) => palaces[(posThienPhu + off) % 12].chinhTinh.push(name));

  let xuong = (10 - birthHour + 12) % 12, khuc = (4 + birthHour) % 12;
  let khong = (11 - birthHour + 12) % 12, kiep = (11 + birthHour) % 12;
  let taPhu = (4 + lunarBirth.m - 1) % 12, huuBat = (10 - (lunarBirth.m - 1) + 12) % 12;
  let locTon = LOC_TON_POS[yCan], kinh = (locTon + 1) % 12, da = (locTon - 1 + 12) % 12;
  let [khoi, viet] = KHOI_VIET_POS[yCan];

  let dir = (yCan % 2 === 0) ? 1 : -1;
  let tieuHao = (locTon + dir * 3 + 12) % 12, daiHao = (locTon + dir * 9 + 12) % 12;

  palaces[xuong].catTinh.push("Văn Xương"); palaces[khuc].catTinh.push("Văn Khúc");
  palaces[taPhu].catTinh.push("Tả Phù"); palaces[huuBat].catTinh.push("Hữu Bật");
  palaces[locTon].catTinh.push("Lộc Tồn"); palaces[khoi].catTinh.push("Thiên Khôi"); palaces[viet].catTinh.push("Thiên Việt");
  palaces[khong].hungTinh.push("Địa Không"); palaces[kiep].hungTinh.push("Địa Kiếp");
  palaces[kinh].hungTinh.push("Kình Dương"); palaces[da].hungTinh.push("Đà La");
  palaces[tieuHao].haoTinh.push("Tiểu Hao"); palaces[daiHao].haoTinh.push("Đại Hao");

  return { palaces };
}

function getBaziTenGod(dayCan, hourCan) {
  let elDay = Math.floor(dayCan / 2), elHour = Math.floor(hourCan / 2);
  let samePol = (dayCan % 2 === hourCan % 2);
  if (elDay === elHour) return samePol ? { name: "Tỷ Kiên", moneyEffect: -4, note: "thích hợp chia sẻ, gắn kết bạn bè" } : { name: "Kiếp Tài", moneyEffect: -15, note: "trực Kiếp Tài — nên giữ ví, cẩn thận mua đắt hoặc chi tiền vì nể nang" };
  if ((elDay + 1) % 5 === elHour) return { name: samePol ? "Thực Thần" : "Thương Quan", moneyEffect: 10, note: "Thực Thương sinh Tài — tâm trí thanh sáng, chi tiêu hoặc đầu tư rất thông minh" };
  if ((elDay + 2) % 5 === elHour) return { name: samePol ? "Thiên Tài" : "Chính Tài", moneyEffect: 14, note: "Tài tinh hiển lộ — thuận lợi giao dịch, chốt đơn, sắm đồ đúng giá trị" };
  if ((elDay + 3) % 5 === elHour) return { name: samePol ? "Thất Sát" : "Chính Quan", moneyEffect: -2, note: "kỷ luật chi tiêu, ưu tiên các khoản cần thiết" };
  return { name: samePol ? "Thiên Ấn" : "Chính Ấn", moneyEffect: 5, note: "Ấn tinh trợ mệnh — hợp chi tiền cho tri thức, sức khỏe hoặc giấy tờ" };
}

function analyzeHourSlot(chart, cungLuuThoi, dayCan, dayChi, hourCan, hIdx, khongVongPair) {
  let pMain = chart.palaces[cungLuuThoi];
  let pXung = chart.palaces[(cungLuuThoi + 6) % 12];
  let pTam1 = chart.palaces[(cungLuuThoi + 4) % 12];
  let pTam2 = chart.palaces[(cungLuuThoi + 8) % 12];

  let domainInfo = PALACE_LIFE_DOMAIN[pMain.cungName];
  let score = 60, moneyScore = 55;
  let positives = [], variables = [], moneyReasons = [];

  let mainStars = pMain.chinhTinh.length ? pMain.chinhTinh : pXung.chinhTinh;
  let starVibes = [];
  mainStars.forEach(st => {
    let sf = STAR_FLAVOR[st];
    if (sf) {
      let factor = pMain.chinhTinh.length ? 1 : 0.7;
      score += Math.round(sf.score * factor);
      moneyScore += Math.round(sf.money * factor);
      starVibes.push(sf.vibe);
      if (["Vũ Khúc", "Thiên Phủ", "Thái Âm"].includes(st) && pMain.chinhTinh.length) {
        moneyReasons.push(`Có Tài tinh <b>${st}</b> tọa thủ: Tích lũy vững vàng, định giá sáng suốt`);
      }
      if (st === "Phá Quân" && pMain.chinhTinh.length) {
        moneyReasons.push(`Gặp <b>Phá Quân</b>: Dễ vung tay chi khoản lớn cho những ý tưởng mới`);
      }
    }
  });

  if (["Tài Bạch", "Điền Trạch"].includes(pMain.cungName)) {
    moneyScore += 10;
    moneyReasons.push(`Lưu Thời vào cung <b>${pMain.cungName}</b>: Mọi khoản chi sắm, tích lũy đều đơm hoa kết trái`);
  }

  if (pMain.catTinh.includes("Lộc Tồn")) {
    score += 12; moneyScore += 16;
    positives.push("Có <b>Lộc Tồn</b> tọa thủ: Dễ đón nhận quà cáp, lộc ăn uống hoặc niềm vui tài chính.");
    moneyReasons.push("Có <b>Lộc Tồn</b>: Xuất tiền hanh thông, đổi lại sự hài lòng xứng đáng");
  }
  if (pMain.catTinh.includes("Thiên Khôi") || pMain.catTinh.includes("Thiên Việt")) {
    score += 10; moneyScore += 6;
    positives.push("Gặp <b>Quý nhân (Khôi/Việt)</b>: Mọi việc xuất hành hay giao dịch đều có người trợ duyên thiện lành.");
  }
  if (pMain.haoTinh.length > 0) {
    let haoName = pMain.haoTinh.join("/");
    moneyScore -= 16;
    variables.push(`Gặp sao <b>${haoName}</b>: Dễ phát sinh các khoản chi ngẫu hứng ngoài dự toán.`);
    moneyReasons.push(`Đụng sao <b>${haoName}</b>: Dễ xuất tiền theo cảm xúc nhất thời`);
  }
  if (pMain.hungTinh.includes("Địa Không") || pMain.hungTinh.includes("Địa Kiếp")) {
    score -= 14; moneyScore -= 20;
    variables.push("Gặp biến số <b>Không/Kiếp</b>: Lịch trình dễ chuyển hướng, nên thong dong thích ứng.");
    moneyReasons.push("Dính <b>Không/Kiếp</b>: Cẩn thận nhầm lẫn, rơi đồ hoặc mua sắm bị hớ");
  }
  if (pMain.hungTinh.includes("Kình Dương") || pMain.hungTinh.includes("Đà La")) {
    score -= 10; moneyScore -= 8;
    variables.push("Vướng <b>Kình/Đà</b>: Tiến độ có thể chậm lại đôi chút; hãy kiên nhẫn, không cần vội.");
  }

  let tenGod = getBaziTenGod(dayCan, hourCan);
  moneyScore += tenGod.moneyEffect;
  if (tenGod.name === "Kiếp Tài") {
    variables.push(`Can giờ gặp <b>Kiếp Tài</b>: Giữ gìn túi tiền cẩn thận, tránh chi tiêu vì sự cả nể.`);
    moneyReasons.push(`Phạm <b>Kiếp Tài</b>: Nên giữ ví, cẩn thận mua đắt hoặc chi hộ người khác`);
  } else if (["Chính Tài", "Thiên Tài", "Thực Thần"].includes(tenGod.name)) {
    moneyReasons.push(`Can giờ đắc <b>${tenGod.name}</b>: Nhạy bén tài khí, thuận lợi chốt giao dịch`);
  }

  let isKhongVong = khongVongPair.includes(hIdx);
  if (isKhongVong) {
    moneyScore -= 14;
    variables.push("Giờ gặp <b>Tuần Không</b>: Khí trường lắng dịu, hợp tĩnh tâm nghỉ ngơi hơn là xuất tiền giao dịch lớn.");
    moneyReasons.push("Phạm <b>Giờ Không Vong</b>: Kỵ đặt cọc lớn hoặc ký kết hợp đồng tài chính");
  }

  let hourHoa = TU_HOA_TABLE[hourCan], dayHoa = TU_HOA_TABLE[dayCan];
  let zones = [
    { p: pMain, w: 1.0, posName: "trực tiếp" },
    { p: pXung, w: 0.75, posName: "chiếu về" },
    { p: pTam1, w: 0.5, posName: "hội hợp" },
    { p: pTam2, w: 0.5, posName: "hội hợp" }
  ];

  zones.forEach(z => {
    let stars = [...z.p.chinhTinh, ...z.p.catTinh];
    stars.forEach(st => {
      if (st === hourHoa[0]) {
        score += Math.round(18 * z.w); moneyScore += Math.round(20 * z.w);
        if (z.w >= 0.75) {
          positives.push(`Kích hoạt <b>Hóa Lộc (${st})</b> ${z.posName}: Tâm tình an vui, tài khí vượng phát, công việc hay dạo chơi đều êm đẹp.`);
          moneyReasons.push(`Kích nổ <b>Lưu Hóa Lộc (${st})</b>: Dòng tiền thuận dòng, chi ra đem lại phúc lộc`);
        }
      }
      if (st === hourHoa[1]) {
        score += Math.round(14 * z.w); moneyScore += Math.round(8 * z.w);
        if (z.w >= 0.75) positives.push(`Kích hoạt <b>Hóa Quyền (${st})</b> ${z.posName}: Làm chủ tình thế, giải quyết công việc quả quyết, tự tin.`);
      }
      if (st === hourHoa[2]) {
        score += Math.round(12 * z.w);
        if (z.w >= 0.75) positives.push(`Kích hoạt <b>Hóa Khoa (${st})</b> ${z.posName}: Trí tuệ quang minh, mọi vướng mắc đều tìm được lối thoát nhẹ nhàng.`);
      }
      if (st === hourHoa[3]) {
        score -= Math.round(20 * z.w); moneyScore -= Math.round(22 * z.w);
        if (z.w >= 0.75) {
          variables.push(`Kích hoạt <b>Hóa Kỵ (${st})</b> ${z.posName}: Cần sự nhẫn nại, tránh để tâm trạng ảnh hưởng đến lời nói và chi tiêu.`);
          moneyReasons.push(`Dính <b>Lưu Hóa Kỵ (${st})</b>: Tránh giao dịch vội vã, đề phòng lỗi chuyển khoản`);
        }
      }
      if (st === dayHoa[0] && z.w >= 0.75) {
        score += 8; moneyScore += 10;
        positives.push(`Hưởng trọn <b>Lộc của cả ngày (${st})</b>: Năng lượng lành hộ trì, gặp nhiều thuận duyên.`);
      }
      if (st === dayHoa[3] && z.w >= 0.75) {
        score -= 10; moneyScore -= 12;
        variables.push(`Chạm điểm <b>Hóa Kỵ của ngày (${st})</b>: Nên giữ tâm thế bình hòa, không vội quyết định chuyện lớn.`);
      }
    });
  });

  score = Math.max(20, Math.min(96, score));
  moneyScore = Math.max(16, Math.min(96, moneyScore));

  let walletStatus = "", walletClass = "", walletTagClass = "", walletAdvice = "", walletType = "";
  let mainReason = moneyReasons.length ? moneyReasons[0] : `Ngũ hành giờ thuộc <b>${tenGod.name}</b> (${tenGod.note})`;

  if (moneyScore >= 70 && !isKhongVong) {
    walletStatus = "Nên Chi / Xứng Đáng";
    walletClass = "w-green";
    walletTagClass = "w-tag-green";
    walletAdvice = `${mainReason}. Thuận lợi chốt đơn, đặt cọc, mua sắm đồ dùng hữu ích hoặc đầu tư.`;
    walletType = "spend";
  } else if (moneyScore >= 52) {
    walletStatus = "Chi Tiêu Bình Hòa";
    walletClass = "w-blue";
    walletTagClass = "w-tag-blue";
    walletAdvice = `${mainReason}. Phù hợp chi tiêu thường nhật, ẩm thực, sinh hoạt thiết yếu.`;
    walletType = "normal";
  } else if (moneyScore >= 38) {
    walletStatus = "Cẩn Trọng Túi Tiền";
    walletClass = "w-gold";
    walletTagClass = "w-tag-gold";
    walletAdvice = `${mainReason}. Chỉ nên mua theo dự định có sẵn, tránh chi tiêu ngẫu hứng.`;
    walletType = "lock";
  } else {
    walletStatus = "Nên Giữ Ví / Tránh Chi";
    walletClass = "w-red";
    walletTagClass = "w-tag-red";
    walletAdvice = `${mainReason}. Không nên đặt cọc lớn, cho vay mượn hay mua sắm tài sản lớn giờ này.`;
    walletType = "lock";
  }

  let statusLabel = "", statusClass = "", barColor = "", advice = "";
  if (score >= 74) {
    statusLabel = "Rất Thuận Lợi"; statusClass = "pill-green"; barColor = "var(--zen-green)"; advice = domainInfo.goodTip;
  } else if (score >= 58) {
    statusLabel = "Bình An / Êm Xuôi"; statusClass = "pill-blue"; barColor = "var(--zen-blue)"; advice = domainInfo.goodTip;
  } else if (score >= 44) {
    statusLabel = "Biến Động Nhẹ"; statusClass = "pill-gold"; barColor = "var(--zen-gold)"; advice = `${domainInfo.badTip} Giữ nhịp độ thong thả, làm việc quen tay.`;
  } else {
    statusLabel = "Nên Nghỉ Ngơi / Tĩnh Lặng"; statusClass = "pill-red"; barColor = "var(--zen-red)"; advice = domainInfo.badTip;
  }

  if (!positives.length && score >= 55) {
    positives.push("Khí vận điều hòa, không gặp cản trở, thuận theo tự nhiên mà hành sự.");
  }

  let vibeSentence = `${domainInfo.vibe} Sắc thái khung giờ ${starVibes.join("; ")}.`;

  return {
    score, moneyScore, statusLabel, statusClass, barColor,
    walletStatus, walletClass, walletTagClass, walletAdvice, walletType,
    tenGodName: tenGod.name, isKhongVong,
    domain: domainInfo.domain, cungName: pMain.cungName,
    mainStars: mainStars.join(", "), vibeSentence, positives, variables, advice
  };
}

/* ==========================================================
   GIAO DIỆN & ĐIỀU KHIỂN
   ========================================================== */
let APP_DATA = [];
let CURRENT_FILTER = "all";
let ACTIVE_HOUR = 5;

const TIME_SLOTS = [
  { h: 0, range: "23:00 - 01:00", short: "23h" },
  { h: 1, range: "01:00 - 03:00", short: "01h" },
  { h: 2, range: "03:00 - 05:00", short: "03h" },
  { h: 3, range: "05:00 - 07:00", short: "05h" },
  { h: 4, range: "07:00 - 09:00", short: "07h" },
  { h: 5, range: "09:00 - 11:00", short: "09h" },
  { h: 6, range: "11:00 - 13:00", short: "11h" },
  { h: 7, range: "13:00 - 15:00", short: "13h" },
  { h: 8, range: "15:00 - 17:00", short: "15h" },
  { h: 9, range: "17:00 - 19:00", short: "17h" },
  { h: 10, range: "19:00 - 21:00", short: "19h" },
  { h: 11, range: "21:00 - 23:00", short: "21h" }
];

function toggleConfig() {
  document.getElementById("cfgPanel").classList.toggle("open");
}

function getNowHourIdx() {
  let hr = new Date().getHours();
  return hr === 23 ? 0 : Math.floor((hr + 1) / 2);
}

function bootApp() {
  let bStr = document.getElementById("birthDate").value;
  let tStr = document.getElementById("targetDate").value;
  let bHour = parseInt(document.getElementById("birthHour").value);
  if (!bStr || !tStr) return;

  localStorage.setItem("zen_birthDate", bStr);
  localStorage.setItem("zen_birthHour", bHour);

  let [by, bm, bd] = bStr.split("-").map(Number);
  let [ty, tm, td] = tStr.split("-").map(Number);

  let lunarBirth = convertSolar2Lunar(bd, bm, by);
  let lunarTarget = convertSolar2Lunar(td, tm, ty);
  let chart = buildBaseChart(lunarBirth, bHour);

  let tYearChi = (lunarTarget.y + 8) % 12;
  let thangGiengPos = (tYearChi - (lunarBirth.m - 1) + bHour + 12) % 12;
  let cungLuuNguyet = (thangGiengPos + lunarTarget.m - 1) % 12;
  let cungLuuNhat = (cungLuuNguyet + lunarTarget.d - 1) % 12;

  let dayCan = (lunarTarget.jd + 9) % 10;
  let dayChi = (lunarTarget.jd + 1) % 12;

  let kv1 = (dayChi - dayCan + 10 + 12) % 12;
  let kv2 = (dayChi - dayCan + 11 + 12) % 12;
  let khongVongPair = [kv1, kv2];

  let todayStr = new Date().toISOString().slice(0, 10);
  let isToday = (tStr === todayStr);
  let nowIdx = isToday ? getNowHourIdx() : -1;

  APP_DATA = TIME_SLOTS.map(slot => {
    let cungLuuThoi = (cungLuuNhat + slot.h) % 12;
    let hourCan = ((dayCan % 5) * 2 + slot.h) % 10;
    let res = analyzeHourSlot(chart, cungLuuThoi, dayCan, dayChi, hourCan, slot.h, khongVongPair);
    return {
      ...slot,
      canChi: `${CAN[hourCan]} ${CHI[slot.h]}`,
      isNow: slot.h === nowIdx,
      ...res
    };
  });

  renderOverview(lunarTarget, dayCan, dayChi, chart.palaces[cungLuuNhat], khongVongPair);
  renderBars();
  renderCards();
}

function renderOverview(lunarTarget, dayCan, dayChi, dayPalace, kvPair) {
  let awakeHours = APP_DATA.filter(x => x.h >= 3);
  let bestH = [...awakeHours].sort((a, b) => b.score - a.score)[0];
  let lowH = [...awakeHours].sort((a, b) => a.score - b.score)[0];
  let bestSpendH = [...awakeHours].sort((a, b) => b.moneyScore - a.moneyScore)[0];
  let worstSpendH = [...awakeHours].sort((a, b) => a.moneyScore - b.moneyScore)[0];

  let dayDomain = PALACE_LIFE_DOMAIN[dayPalace.cungName];
  let dayHoaLoc = TU_HOA_TABLE[dayCan][0];
  let dayHoaKy = TU_HOA_TABLE[dayCan][3];

  document.getElementById("dayBanner").innerHTML = `
    <div class="badge-capsules">
      <span class="zen-pill">Âm lịch: ${lunarTarget.d}/${lunarTarget.m}/${lunarTarget.y} • Ngày ${CAN[dayCan]} ${CHI[dayChi]}</span>
      <span class="zen-pill zen-pill-hl">Giờ Không Vong: ${CHI[kvPair[0]]}, ${CHI[kvPair[1]]}</span>
    </div>
    <div class="day-maintitle">Trọng tâm ngày: ${dayDomain.domain} (Cung ${dayPalace.cungName})</div>
    <div class="day-maindesc">
      ${dayDomain.vibe} Sao <b>${dayHoaLoc}</b> Hóa Lộc mang lại thiện duyên và hỷ khí, nhưng cần sự an tĩnh trước sao <b>${dayHoaKy}</b> Hóa Kỵ để giữ cho tâm trí luôn sáng suốt.
    </div>
    <!-- 4 Khung vuốt ngang trơn tru -->
    <div class="summary-tiles-scroll">
      <div class="zen-tile t-green" onclick="jumpToHour(${bestH.h})">
        <div class="tile-tag" style="color:var(--zen-green)">✨ Khí Vận Đẹp Nhất</div>
        <div class="tile-time">${bestH.range} (${CHI[bestH.h]})</div>
        <div class="tile-sub">${bestH.domain} • ${bestH.score}đ</div>
      </div>
      <div class="zen-tile t-red" onclick="jumpToHour(${lowH.h})">
        <div class="tile-tag" style="color:var(--zen-red)">🌿 Nên Tĩnh Lặng</div>
        <div class="tile-time">${lowH.range} (${CHI[lowH.h]})</div>
        <div class="tile-sub">${lowH.domain} • ${lowH.score}đ</div>
      </div>
      <div class="zen-tile t-blue" onclick="jumpToHour(${bestSpendH.h})">
        <div class="tile-tag" style="color:var(--zen-blue)">💸 Chi Tiền Đắc Lộc</div>
        <div class="tile-time">${bestSpendH.range} (${CHI[bestSpendH.h]})</div>
        <div class="tile-sub">${bestSpendH.walletStatus} • ${bestSpendH.moneyScore}đ</div>
      </div>
      <div class="zen-tile t-gold" onclick="jumpToHour(${worstSpendH.h})">
        <div class="tile-tag" style="color:var(--zen-gold)">🔒 Nên Gìn Giữ Ví</div>
        <div class="tile-time">${worstSpendH.range} (${CHI[worstSpendH.h]})</div>
        <div class="tile-sub">${worstSpendH.walletStatus} • ${worstSpendH.moneyScore}đ</div>
      </div>
    </div>
  `;
}

function renderBars() {
  document.getElementById("barsGrid").innerHTML = APP_DATA.map(item => {
    let wIcon = item.walletType === "spend" ? "💸" : (item.walletType === "lock" ? "🔒" : "");
    return `
      <div class="b-col ${item.h === ACTIVE_HOUR ? 'active' : ''}" onclick="jumpToHour(${item.h})">
        ${item.isNow ? '<span class="now-indicator" title="Hiện tại"></span>' : ''}
        <span class="b-score">${item.score}</span>
        <div class="b-stem" style="height:${item.score}%; background:${item.barColor}"></div>
        <span class="b-label">${CHI[item.h]}<br>${item.short} ${wIcon}</span>
      </div>
    `;
  }).join("");
}

function renderCards() {
  let list = APP_DATA;
  if (CURRENT_FILTER === "spend") list = APP_DATA.filter(x => x.walletType === "spend" || x.moneyScore >= 65);
  if (CURRENT_FILTER === "lock") list = APP_DATA.filter(x => x.walletType === "lock");
  if (CURRENT_FILTER === "good") list = APP_DATA.filter(x => x.score >= 60);

  document.getElementById("timelineStack").innerHTML = list.map(item => `
    <div class="zen-card ${item.h === ACTIVE_HOUR ? 'focused' : ''}" id="zcard-${item.h}" onclick="focusCard(${item.h})">
      <div class="card-top">
        <div>
          <div class="card-time">
            <span>${item.range}</span>
            <span style="color:var(--text-muted); font-size:0.92rem; font-weight:500;">(Giờ ${item.canChi})</span>
            ${item.isNow ? '<span class="badge-live-now">HIỆN TẠI</span>' : ''}
          </div>
          <div class="card-target">Khí vận: <b>${item.domain}</b></div>
        </div>
        <div class="card-verdict-pill ${item.statusClass}">${item.statusLabel} • ${item.score}đ</div>
      </div>

      <!-- Khung radar tài khí bố cục 2 tầng chuẩn chỉnh -->
      <div class="wallet-box ${item.walletClass}">
        <div class="wallet-header">
          <div class="wallet-title">💸 Túi tiền (${item.moneyScore}đ)</div>
          <span class="w-tag ${item.walletTagClass}">${item.walletStatus}</span>
        </div>
        <div class="wallet-body">${item.walletAdvice}</div>
      </div>

      <div class="card-vibe">${item.vibeSentence}</div>

      <div class="lines-list">
        ${item.positives.map(p => `
          <div class="line-row">
            <span class="line-icon">🌱</span>
            <div><span class="line-title t-gr">Điểm lành:</span>${p}</div>
          </div>
        `).join("")}

        ${item.variables.map(v => `
          <div class="line-row">
            <span class="line-icon">🍃</span>
            <div><span class="line-title t-go">Lưu tâm:</span>${v}</div>
          </div>
        `).join("")}

        <div class="line-row">
          <span class="line-icon">🧭</span>
          <div><span class="line-title t-bl">Gợi ý nhịp sống:</span>${item.advice}</div>
        </div>
      </div>

      <div class="card-foot">
        <span>Cung Lưu Thời: ${item.cungName} (${item.mainStars})</span>
        <span>Thập thần: ${item.tenGodName}${item.isKhongVong ? ' • Giờ Không Vong' : ''}</span>
      </div>
    </div>
  `).join("");
}

function focusCard(hIdx) {
  ACTIVE_HOUR = hIdx;
  renderBars();
  document.querySelectorAll(".zen-card").forEach(el => el.classList.remove("focused"));
  let target = document.getElementById(`zcard-${hIdx}`);
  if (target) target.classList.add("focused");
}

function jumpToHour(hIdx) {
  ACTIVE_HOUR = hIdx;
  if (CURRENT_FILTER !== "all") {
    CURRENT_FILTER = "all";
    document.querySelectorAll(".zen-f-btn").forEach((b, i) => b.classList.toggle("active", i === 0));
  }
  renderBars();
  renderCards();
  let el = document.getElementById(`zcard-${hIdx}`);
  if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
}

function applyFilter(type, btn) {
  CURRENT_FILTER = type;
  document.querySelectorAll(".zen-f-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderCards();
}

function adjustDay(delta) {
  let inp = document.getElementById("targetDate");
  let d = new Date(inp.value + "T00:00:00");
  d.setDate(d.getDate() + delta);
  inp.value = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  bootApp();
}

function goToday() {
  let now = new Date();
  document.getElementById("targetDate").value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  ACTIVE_HOUR = getNowHourIdx();
  bootApp();
}

window.addEventListener("DOMContentLoaded", () => {
  let sbDate = localStorage.getItem("zen_birthDate");
  let sbHour = localStorage.getItem("zen_birthHour");
  if (sbDate) document.getElementById("birthDate").value = sbDate;
  if (sbHour !== null) document.getElementById("birthHour").value = sbHour;
  goToday();
});
</script>
